name: compile M2
# Pipeline publico: engine DesertDroid lift + compila o jogo + smoke boot M3.
# O jogo NAO vive aqui (BYOG): FalloutNV.exe vem de release PRIVADA de
# Kapro777/fnv-build-inputs via secret FNV_PAT. Nada do jogo vai publico:
# boot.log, C liftado e simbolos sao uploadados numa release privada.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compile-public.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PCRECOMP: ${{ github.workspace }}/external/pcrecomp
      WORK: ${{ github.workspace }}/work
      EXE: ${{ github.workspace }}/FalloutNV.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          mkdir -p "$WORK"
          sudo apt-get update -qq
           sudo apt-get install -y -qq cmake ninja-build build-essential ccache gdb zstd libvorbis-dev libogg-dev pkg-config > /dev/null
          pip install -q capstone pefile
          ccache --set-config=max_size=8.0G

      - name: Exec privado (BYOG, nunca publicado)
        run: |
          mkdir -p Data
          # A release privada v0-bootstrap carrega o BYOG completo: exe + dados
          # essenciais (esm, ini default). Baixa o que existir — asset ausente
          # nao falha o passo (a release cresce aos poucos, BYOG).
          have() { gh release view v0-bootstrap -R Kapro777/fnv-build-inputs --json assets -q '.assets[].name' | grep -qx "$1"; }
          for a in FalloutNV.exe FalloutNV.esm Fallout_default.ini low.ini medium.ini high.ini VeryHigh.ini \
                   "Fallout - Meshes.bsa" "Fallout - Textures.bsa" "Fallout - Textures2.bsa" \
                   "Fallout - Sound.bsa" "Fallout - Voices1.bsa" "Fallout - Misc.bsa" Update.bsa; do
            remote="$a"
            if ! have "$remote"; then remote="${a// /.}"; fi
            if have "$remote"; then
              gh release download v0-bootstrap -R Kapro777/fnv-build-inputs -p "$remote" --clobber
              if [ "$remote" != "$a" ]; then mv -- "$remote" "$a"; fi
              echo "ok: $a"
            else
              echo "ausente (skip): $a"
            fi
          done
          # esm/bsa ficam em Data\ (o dd_fs mapeia C:\FalloutNV\Data -> ./Data)
          for f in *.bsa FalloutNV.esm; do
            [ -f "$f" ] && mv -f "$f" Data/
          done
          ls -lh FalloutNV.exe Data/ 2>/dev/null | head -20
          sha256sum FalloutNV.exe | head -c 16
          echo ' (prefixo do sha256; hash completo confere em repositorio privado)'
        env:
          GH_TOKEN: ${{ secrets.FNV_PAT }}

      - name: Tooling DesertDroid + pcrecomp pinned
        run: |
          git clone -q https://github.com/Kapro777/DesertDroid.git tooling
          git clone -q https://github.com/sp00nznet/pcrecomp.git external/pcrecomp
          cd external/pcrecomp
          git checkout -q 35548b8
          git config user.name ci
          git config user.email ci@localhost
          git apply "$GITHUB_WORKSPACE/tooling/patches/pcrecomp/pcrecomp_changes.patch"
          git log --oneline -1

      - name: Sintaxe do tooling (antes do lift)
        run: |
          python3 -m py_compile tooling/tools/difftest32.py
          printf '#include "recomp_types.h"\n' | gcc -x c -fsyntax-only \
            -I "$PCRECOMP/runtime/recomp32" -
          gcc -O2 -I "$PCRECOMP/runtime/recomp32" tooling/tools/check_call_abi.c -lm -o "$WORK/check-call"
          "$WORK/check-call"
          gcc -O2 -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -I "$PCRECOMP/runtime/recomp32" -I "$PCRECOMP/runtime/win32hle" \
            tooling/tools/check_context.c -lm -lpthread -o "$WORK/check-context"
          "$WORK/check-context"

      - name: Seeds (vtable + RTTI)
        run: |
          exec > "$WORK/seeds.log" 2>&1
          cd "$PCRECOMP"
          python3 tools/cpp/vtable_scan.py "$EXE" --seeds "$WORK/vtable_seeds.json"
          python3 tools/cpp/rtti.py "$EXE" --seeds "$WORK/rtti_seeds.json" --names "$WORK/names.json"
          python3 "$GITHUB_WORKSPACE/tooling/tools/merge_seeds.py" "$EXE" "$WORK/seeds_all.json" \
            "$WORK/vtable_seeds.json" "$WORK/rtti_seeds.json"

      - name: Catalogo (recursive descent)
        run: |
          exec > "$WORK/catalog.log" 2>&1
          python3 "$GITHUB_WORKSPACE/tooling/tools/run_lift.py" catalog "$EXE" \
            "$WORK/seeds_all.json" "$WORK/catalog.json"

      - name: Lift (x86-32 -> C)
        run: |
          exec > "$WORK/lift.log" 2>&1
          python3 "$GITHUB_WORKSPACE/tooling/tools/run_lift.py" lift "$EXE" \
            "$WORK/catalog.json" "$WORK/gen" --names "$WORK/names.json" --split 300

      - name: Relatorio M0/M1
        run: |
          python3 "$GITHUB_WORKSPACE/tooling/tools/m0_report.py" "$WORK" | tee "$WORK/m0_report.txt"

      - name: Diagnostico do catalogo (fronteiras reais das funcoes)
        run: |
          python3 - <<'EOF' > "$WORK/catalog_lookup.txt" 2>&1
          import json, bisect
          cat = json.load(open("work/catalog.json"))
          funcs = sorted((f["address"], f["end"]) for f in cat["functions"])
          starts = [a for a, e in funcs]
          targets = {
              0xEDCF9C: "cookie (meu palpite)",
              0xEDCFD1: "site do GetSystemTimeAsFileTime",
              0xECB75D: "scrt_seh (meu palpite)",
              0xECB8DB: "restart path",
              0x869C50: "WINMAIN (xref do CRT)",
              0xECB86B: "call site do WinMain",
              0xECC4DB: "entry adulterado",
          }
          for t, why in targets.items():
              i = bisect.bisect_right(starts, t) - 1
              if i >= 0 and funcs[i][0] <= t < funcs[i][1]:
                  print(f"VA {t:#010x} ({why}) -> funcao sub_{funcs[i][0]:08X} .. {funcs[i][1]:#x} (tam {funcs[i][1]-funcs[i][0]})")
              else:
                  print(f"VA {t:#010x} ({why}) -> FORA de qualquer funcao catalogada")
          with open("work/dispatch_vas.txt", "w") as f:
              for a, e in funcs:
                  f.write(f"{a:08X} {e:08X}\n")
          print("dispatch_vas.txt escrito com", len(funcs), "funcoes")
          EOF

      - name: Overrides (scrt real + WinMain, fora das fronteiras do catalogo)
        run: |
          exec > "$WORK/overrides.log" 2>&1
          python3 "$GITHUB_WORKSPACE/tooling/tools/lift_override.py" "$EXE" \
            "$WORK/catalog.json" "$WORK/names.json" "$WORK/gen" \
            0xECB75D:0xECBA8E 0x869C50:0x86A800

      - name: Build M2 (compila o jogo recompilado)
        run: |
          cmake -S "$GITHUB_WORKSPACE/tooling" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DPCRECOMP="$PCRECOMP" -DGEN_DIR="$WORK/gen"
          if ! cmake --build build -j"$(nproc)" > "$WORK/build_errors.log" 2>&1; then
            echo "::error::compilacao falhou; diagnostico na release privada"
            exit 1
          fi
          echo "BUILD OK: $(ls -lh build/DesertDroid | awk '{print $5}')"

      - name: Guarda build privado para diagnosticos sem recompilar
        run: |
          TAG="logs-${{ github.run_id }}"
          gzip -c build/DesertDroid > "$WORK/DesertDroid.gz"
          tar -C "$GITHUB_WORKSPACE" --zstd -cf "$WORK/build-state.tar.zst" build work/gen
          gh release view "$TAG" -R Kapro777/fnv-build-inputs > /dev/null 2>&1 || \
            gh release create "$TAG" -R Kapro777/fnv-build-inputs --title "diagnosticos run ${{ github.run_id }}" --notes "Build e diagnosticos privados"
          gh release upload "$TAG" -R Kapro777/fnv-build-inputs "$WORK/DesertDroid.gz" --clobber
          gh release upload "$TAG" -R Kapro777/fnv-build-inputs "$WORK/build-state.tar.zst" --clobber
        env:
          GH_TOKEN: ${{ secrets.FNV_PAT }}

      - name: Difftest experimental (ainda nao valida o lifter)
        continue-on-error: true
        run: |
          pip install -q unicorn
          python3 "$GITHUB_WORKSPACE/tooling/tools/difftest32.py" "$EXE" "$WORK/difftest" 3 \
            > "$WORK/difftest.log" 2>&1

      - name: Dump de simbolos (symbolizacao de backtrace)
        run: |
          cd build
          nm -n DesertDroid 2>/dev/null | gzip > "$WORK/symbols.txt.gz" || true
          zcat "$WORK/symbols.txt.gz" | wc -l

      - name: Smoke boot M3 (sob GDB — diagnostico do boot/CRT)
        run: |
          cd build
          set +e
          timeout --kill-after=30s 240s gdb -batch -nx \
            -ex 'set confirm off' \
            -ex 'handle SIGSEGV stop noprint nopass' \
             -ex 'handle SIGABRT stop noprint nopass' \
             -ex "source $GITHUB_WORKSPACE/tooling/tools/gdb_deadline.py" \
            -ex run \
            -ex 'printf "\n=== GDB: ESTADO FINAL DO PROCESSO ===\n"' \
            -ex 'printf "si_addr: "' \
            -ex 'p/x $_siginfo._sifields._sigfault.si_addr' \
            -ex 'printf "pc: "' \
            -ex 'p/x $pc' \
            -ex 'info registers' \
            -ex 'printf "\n=== disas ao redor do fault ===\n"' \
            -ex 'x/30i $pc-48' \
            -ex 'printf "\n=== stack do fault ===\n"' \
            -ex 'x/16xg $rsp' \
             -ex 'printf "\n=== backtrace ===\n"' \
             -ex 'thread apply all bt 32' \
             -ex 'thread 1' \
             -ex 'printf "\n=== guest state (machine owner) ===\n"' \
             -ex 'p/x (unsigned int)g_cur_func' -ex 'p/x (unsigned int)g_eax' \
             -ex 'p/x (unsigned int)g_ecx' -ex 'p/x (unsigned int)g_edx' \
             -ex 'p/x (unsigned int)g_ebx' -ex 'p/x (unsigned int)g_esp' \
             -ex 'p/x (unsigned int)g_ebp' -ex 'p/x (unsigned int)g_esi' \
             -ex 'p/x (unsigned int)g_edi' -ex 'p/x (unsigned int)g_icall_count' \
             -ex 'p/x (unsigned int)g_backedges' \
             -ex 'info registers' -ex 'x/30i $pc-48' -ex 'bt 24' \
             --args ./DesertDroid "$EXE" > "$WORK/boot.log" 2>&1
          status=$?
          echo "gdb_exit=$status" > "$WORK/boot_status.txt"
          echo "Captura diagnostica encerrada (status $status); nao comprova boot completo."

      - name: Extrai C liftado das funcoes do crash
        run: |
          F=$(grep -rln "sub_00AA35A0" "$WORK/gen" --include="*.c" 2>/dev/null | head -1 || true)
          echo "arquivo com sub_00AA35A0: $F"
          if [ -n "$F" ]; then
            gzip -c "$F" > "$WORK/lifted_crash_src.c.gz"
          fi
          : > "$WORK/lifted_boot_functions.c"
          declare -A SEEN_BOOT_TU
          for VA in 00EC408C 00EC8E14 00ED5BAE 00EE11E9 00EE13A3 00EC5EC0 00EDD92C 00EDDB9A \
                   00A61AD0 00A61590 00A64900 00A5E8A0 0044F560 00879550 00404FFE 006FF60E 00401050 00406D30; do
            B=$(grep -rln -F "void sub_${VA}(void)" "$WORK/gen" --include="*.c" 2>/dev/null | head -1 || true)
            echo "definicao sub_${VA}: ${B:-NAO ENCONTRADA}"
            if [ -n "$B" ] && [ -z "${SEEN_BOOT_TU[$B]+x}" ]; then
              cat "$B" >> "$WORK/lifted_boot_functions.c"
              SEEN_BOOT_TU["$B"]=1
            fi
          done
          if [ -s "$WORK/lifted_boot_functions.c" ]; then
            gzip -c "$WORK/lifted_boot_functions.c" > "$WORK/lifted_boot_src.c.gz"
          fi

      # ---- Logs do DOE sao PRIVADOS: sobem como release privada no fnv-build-inputs ----
      - name: Upload privado (boot.log, C liftado, simbolos)
        if: always()
        run: |
          TAG="logs-${{ github.run_id }}"
          # Cria a release SEM assets (sempre existe), depois sobe cada
          # arquivo que existir: um arquivo ausente (ex.: lift_stats.json
          # em run de cache-miss) NAO pode engolir o boot.log de novo
          # (run 40983424557: 'no matches found' derrubou a release toda).
          gh release create "$TAG" -R Kapro777/fnv-build-inputs \
            --title "diagnosticos run ${{ github.run_id }} (publico->privado)" \
            --notes "boot.log + C liftado + simbolos do run ${{ github.run_id }}" 2>&1 || true
          for f in "$WORK/"*.log "$WORK/boot_status.txt" "$WORK/catalog_lookup.txt" "$WORK/difftest/report.txt" "$WORK/symbols.txt.gz" \
                   "$WORK/lifted_crash_src.c.gz" "$WORK/lifted_boot_src.c.gz" \
                   work/lift_stats.json; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" -R Kapro777/fnv-build-inputs "$f" --clobber 2>&1 | tail -1
            else
              echo "ausente (skip): $f"
            fi
          done
          echo '=== assets da release privada: ==='
          gh release view "$TAG" -R Kapro777/fnv-build-inputs --json assets \
            -q '.assets[].name' 2>&1 || true
        env:
          GH_TOKEN: ${{ secrets.FNV_PAT }}

      # ---- Publico: so estatisticas de pipeline, sem codigo do jogo ----
      - name: Artefatos publicos (estatisticas sem codigo do jogo)
        uses: actions/upload-artifact@v4
        with:
          name: m2-report-public
          path: |
            work/m0_report.txt
          if-no-files-found: warn
